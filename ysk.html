<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пригласительная открытка</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
    }

    /* Контейнер для 3D эффекта переворота */
    .card-container {
      width: 100%;
      max-width: 420px;
      height: 550px;
      perspective: 1000px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    /* Стороны открытки */
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
    }

    /* Лицевая сторона */
    .card-front {
      background: #ffffff;
      border: 3px solid #b8c6db;
    }

    .card-front h1 {
      color: #333;
      font-size: 28px;
      margin-bottom: 15px;
    }

    .card-front p {
      color: #666;
      font-size: 16px;
      margin-bottom: 30px;
    }

    .btn-open {
      padding: 12px 28px;
      background: linear-gradient(135deg, #6e8efb, #a777e3);
      color: #fff;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 5px 15px rgba(110, 142, 251, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-open:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(110, 142, 251, 0.6);
    }

    /* Обратная сторона */
    .card-back {
      background: #ffffff;
      transform: rotateY(180deg);
      border: 3px solid #a777e3;
    }

    .card-back h2 {
      color: #5a4bda;
      font-size: 24px;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .info-group {
      margin: 15px 0;
      width: 100%;
    }

    .info-label {
      font-size: 13px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .info-value {
      font-size: 20px;
      color: #222;
      font-weight: 600;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(135deg, #6e8efb, #a777e3);
      margin: 15px 0;
      border-radius: 2px;
    }

    .time-badge {
      display: inline-block;
      background: #eef2ff;
      color: #4f46e5;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 22px;
      font-weight: bold;
      margin-top: 5px;
      border: 1px solid #c7d2fe;
    }

    .hint {
      margin-top: 25px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="card" id="inviteCard">
      
      <!-- Лицевая сторона -->
      <div class="card-front">
        <h1>Вам Приглашение!</h1>
        <p>Нажмите на карточку, чтобы открыть</p>
        <button class="btn-open">Открыть</button>
      </div>

      <!-- Обратная сторона -->
      <div class="card-back">
        <h2>Приглашение</h2>
        
        <div class="info-group">
          <div class="info-label">Вас приглашает</div>
          <div class="info-value">Касенова Айнур Ериковна</div>
        </div>

        <div class="divider"></div>

        <div class="info-group">
          <div class="info-label">Место проведения</div>
          <div class="info-value">34 кабинет</div>
        </div>

        <div class="divider"></div>

        <div class="info-group">
          <div class="info-label">Время сбора</div>
          <div class="time-badge">15:00</div>
        </div>

        <div class="hint">Нажмите, чтобы перевернуть обратно</div>
      </div>

    </div>
  </div>

  <script>
    const card = document.getElementById('inviteCard');

    // Переворот открытки при клике
    card.addEventListener('click', () => {
      card.classList.toggle('flipped');
    });
  </script>

</body>
</html>
